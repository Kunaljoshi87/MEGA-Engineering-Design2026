<script>
"use strict";

/* ======================================================================
   V17 COMPLETE ONE-FORM ENGINEERING DESIGN CONTROL
   ----------------------------------------------------------------------
   READS existing masters:
     - Project master
     - Drawing master
     - Equipment master
     - Employee master

   WRITES only one existing transaction form:
     - Design_Tracking

   Assignment hierarchy:
     Primary_Assignment_ID + Assigned_From_ID + Assignment_Level

   Revision hierarchy:
     Logical_Task_Key = EXEC::<AssignmentRecordID>::R<n>
     Revision_Key     = EXEC::<AssignmentRecordID>::R<n>
     Parent_Design_ID = previous revision record ID

   Therefore no new transaction form and no extra Revision form are needed.
   ====================================================================== */
const CONFIG={
  APP_NAME:"mega-engineering-sales",
  DEMO:new URLSearchParams(location.search).get("demo")==="1",
  LIVE_WRITES:true,
  MAX_FILE_BYTES:50*1024*1024,
  REPORTS:{
    projects:"All_Associated_Projects",
    drawings:"All_Drawing_Types",
    equipment:"Master_Equipment_List_Subform_Report",
    employees:"Employ_to_Create_ticket_Report",
    tracking:"Design_Tracking_Report"
  },
  FORMS:{tracking:"Design_Tracking"},
  TRACKING_REPORT_CANDIDATES:[
    "Design_Tracking_Report",
    "All_Design_Tracking",
    "Design_Tracking"
  ],
  SYNC_ASSIGNMENT_START:true,
  PAGE_SIZE:100,
  MAX_BATCH:250
};

const AF={
  projectCode:"Project_Code",projectRecordId:"Project_Record_ID",
  sourceEquipmentRecordId:"Source_Equipment_Record_ID",
  plantSection:"Plant_Section_Name",plantSectionType:"Plant_Section_Type",
  tagNo:"Tag_Number",equipmentName:"Equipment_Name",equipmentCategory:"Equipment_Category",
  equipmentType:"Equipment_Type",department:"Equipment_Department",groupCode:"Group_Code",
  designDepartment:"Design_Department",designType:"Design_Type",designTitle:"Design_Title",
  drawingNumber:"Drawing_Number",priority:"Priority",
  startDate:"Planned_Start_Date",targetDate:"Forecast_End_Date",endDate:"Planned_End_Date",
  actualStart:"Actual_Start_Date",actualEnd:"Actual_End_Date",
  assignedTo:"Assigned_To",assignedEmployeeName:"Assigned_Employee_Name",
  checker:"Checker",reviewer:"Reviewer",approver:"Approver",
  status:"Status",progress:"Progress",revision:"Revision",revisionDescription:"Revision_Description",
  drawingFile:"Drawing_File",nativeFile:"Native_File",supportingFile:"Supporting_File",
  remark:"Remarks",returnReason:"Return_Reason",parentDesignId:"Parent_Design_ID",
  startedBy:"Started_By",completedBy:"Completed_By",
  drawingMasterId:"Drawing_Master_ID",scopeLevel:"Scope_Level",logicalTaskKey:"Logical_Task_Key",
  revisionKey:"Revision_Key",equipmentRecordId:"Equipment_Record_ID",
  drawingDocument:"Drawing_Document_Name",shortName:"Short_Name",active:"Active",
  primaryAssignment:"Primary_Assignment_ID",assignedFrom:"Assigned_From_ID",assignmentLevel:"Assignment_Level",
  assignedBy:"Assigned_By",criteria:"Assignment_Criteria",responsibility:"Responsibility",furtherAssigned:"Further_Assigned"
};

const CRITERIA=[
  {key:"plantSection",label:"Plant Section",field:AF.plantSection,icon:"§",equipment:["Plant_Section_Name","Plant_Section"]},
  {key:"plantSectionType",label:"Plant Section Type",field:AF.plantSectionType,icon:"◇",equipment:["Plant_Section_Type","Section_Type"]},
  {key:"tag",label:"Tag / Equipment",field:AF.tagNo,icon:"#",equipment:["Tag_Number","Tag_No"],extra:true},
  {key:"groupCode",label:"Group Code",field:AF.groupCode,icon:"G",equipment:["Group_Code","Group"]},
  {key:"department",label:"Department",field:AF.department,icon:"D",equipment:["Department_Code","Department"]},
  {key:"equipmentCategory",label:"Equipment Category",field:AF.equipmentCategory,icon:"C",equipment:["Equipment_Category","Category"]},
  {key:"equipmentType",label:"Equipment Type",field:AF.equipmentType,icon:"T",equipment:["Equipment_Type","Type"]}
];
const ASSIGNMENT_STATUSES=["Not Started","In Progress","On Hold","Completed","Cancelled"];
const PRIORITIES=["Low","Medium","High","Critical"];
const DESIGN_STATUSES=["Not Started","In Progress","Submitted for Check","Checking","Checked","Submitted for Review","Reviewing","Reviewed","Submitted for Approval","Approving","Approved","Issued","Completed","Returned","On Hold","Cancelled"];
const DESIGN_PROGRESS={"Not Started":0,"In Progress":10,"Submitted for Check":50,"Checking":55,"Checked":60,"Submitted for Review":65,"Reviewing":70,"Reviewed":80,"Submitted for Approval":85,"Approving":90,"Approved":95,"Issued":100,"Completed":100,"Returned":40,"On Hold":10,"Cancelled":0};
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const PROJECT_ALIASES={id:["ID"],code:["Project_Code","Project_Code1","Project"],name:["Project_Name","Project_Description","Description","Customer_Name"]};
const DRAWING_ALIASES={id:["ID"],name:["Drawing_Name","Drawing_Document_Name","Drawing_Document","Name"],short:["Drawing_Abbreviation","Short_Name","Abbreviation"],type:["Drawing_Type","Type"],active:["Active"]};
const EMP_ALIASES={id:["ID"],name:["Employee_Name","Name","Employee"],email:["Email","Employee_Email"],dept:["Department","Department_Name"]};
const EQ_ALIASES={id:["ID"],project:["Project_Code","Project_Code1","Project"],section:["Plant_Section_Name","Plant_Section"],sectionType:["Plant_Section_Type","Section_Type"],tag:["Tag_Number","Tag_No"],name:["Equipment_Name","Equipment"],group:["Group_Code","Group"],department:["Department_Code","Department"],category:["Equipment_Category","Category"],type:["Equipment_Type","Type"]};
const SYSTEM_ALIASES={addedTime:["Added_Time","Created_Time","Created_Time1"],addedUser:["Added_User","Created_By","Created_User"],modifiedTime:["Modified_Time","Updated_Time","Modified_Time1"],modifiedUser:["Modified_User","Updated_By","Modified_By"]};

const S={
  demo:CONFIG.DEMO,user:"",app:CONFIG.APP_NAME,view:"home",previousView:"home",globalSearch:"",
  projects:[],drawings:[],employees:[],equipment:[],records:[],assignments:[],revisions:[],
  project:null,drawing:null,current:null,detailTab:"overview",expanded:new Set(),
  selectedCriteria:new Set(),selectedTargets:new Set(),targetRows:[],targetSearch:"",bulk:{},
  newProjectId:"",newDrawingId:"",logs:[]
};
const $=id=>document.getElementById(id);
const h=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const nk=v=>String(v??"").toLowerCase().replace(/[^a-z0-9]/g,"");
function scalar(v){if(v==null)return"";if(typeof v!=="object")return String(v);if(v.display_value!=null)return scalar(v.display_value);if(v.zc_display_value!=null)return scalar(v.zc_display_value);if(v.email)return String(v.email);if(v.ID!=null)return String(v.ID);const vals=Object.values(v).filter(x=>x!=null&&typeof x!=="object");return vals.join(" ");}
function pick(r,aliases,f=""){if(!r)return f;for(const a of aliases||[])if(Object.prototype.hasOwnProperty.call(r,a))return scalar(r[a]);const keys=Object.fromEntries(Object.keys(r).map(k=>[nk(k),k]));for(const a of aliases||[]){const k=keys[nk(a)];if(k)return scalar(r[k]);}return f;}
function idOf(r){return scalar(r?.ID||r?.id)}
function num(v,f=0){const n=Number(String(v??"").replace(/,/g,""));return Number.isFinite(n)?n:f}
function initials(name){return String(name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?"}
function todayIso(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function toCreatorDate(v){if(!v)return"";const p=String(v).split("-");if(p.length!==3)return v;return `${p[2]}-${MONTHS[Number(p[1])-1]}-${p[0]}`}
function toCreatorDateTime(d=new Date()){return `${String(d.getDate()).padStart(2,"0")}-${MONTHS[d.getMonth()]}-${d.getFullYear()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`}
function toInputDate(v){const s=scalar(v).trim();if(!s)return"";if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/);if(m){const mi=MONTHS.findIndex(x=>x.toLowerCase()===m[2].toLowerCase())+1;return `${m[3]}-${String(mi).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;}const d=new Date(s);return Number.isNaN(d.getTime())?"":`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function displayDate(v){const iso=toInputDate(v);return iso?iso.split("-").reverse().join("-"):"—"}
function displayDateTime(v){const s=scalar(v);if(!s)return"—";return s.replace(/-/g," ")}
function toast(msg,type=""){const e=document.createElement("div");e.className=`toast ${type}`;e.textContent=msg;$("toasts").appendChild(e);setTimeout(()=>e.remove(),4800)}
let loadDepth=0;function busy(msg="Loading…"){loadDepth++;$("loadingText").textContent=msg;$("loading").classList.remove("hidden")}function idle(){loadDepth=Math.max(0,loadDepth-1);if(!loadDepth)$("loading").classList.add("hidden")}
function log(action,data={}){S.logs.push({at:new Date().toISOString(),action,data});if(S.logs.length>250)S.logs.shift()}
function dateDiffDays(iso){if(!iso)return null;const a=new Date(todayIso()+"T00:00:00"),b=new Date(iso+"T00:00:00");return Math.round((b-a)/86400000)}
function isClosedAssignment(a){return ["Completed","Cancelled"].includes(scalar(a?.[AF.status]))}
function isClosedRevision(r){return ["Approved","Issued","Completed","Cancelled"].includes(scalar(r?.[AF.status]))}
function statusClass(s){if(["Completed","Issued","Approved","Checked","Reviewed"].includes(s))return"green";if(["In Progress","Checking","Reviewing","Approving","Submitted for Check","Submitted for Review","Submitted for Approval"].includes(s))return"blue";if(["On Hold","Returned"].includes(s))return"amber";if(["Cancelled"].includes(s))return"red";return""}
function statusPill(s){return `<span class="pill ${statusClass(s)}">${h(s||"Not Started")}</span>`}
function progressBar(p){const n=Math.max(0,Math.min(100,num(p)));return `<div class="progress"><span style="width:${n}%"></span></div>`}

function adaptProject(r){return{raw:r,id:pick(r,PROJECT_ALIASES.id),code:pick(r,PROJECT_ALIASES.code),name:pick(r,PROJECT_ALIASES.name)}}
function adaptDrawing(r){return{raw:r,id:pick(r,DRAWING_ALIASES.id),name:pick(r,DRAWING_ALIASES.name),short:pick(r,DRAWING_ALIASES.short),type:pick(r,DRAWING_ALIASES.type),active:pick(r,DRAWING_ALIASES.active)}}
function adaptEmployee(r){return{raw:r,id:pick(r,EMP_ALIASES.id),name:pick(r,EMP_ALIASES.name),email:pick(r,EMP_ALIASES.email),department:pick(r,EMP_ALIASES.dept)}}
function adaptEquipment(r){return{raw:r,id:pick(r,EQ_ALIASES.id),project:pick(r,EQ_ALIASES.project),plantSection:pick(r,EQ_ALIASES.section),plantSectionType:pick(r,EQ_ALIASES.sectionType),tag:pick(r,EQ_ALIASES.tag),name:pick(r,EQ_ALIASES.name),groupCode:pick(r,EQ_ALIASES.group),department:pick(r,EQ_ALIASES.department),equipmentCategory:pick(r,EQ_ALIASES.category),equipmentType:pick(r,EQ_ALIASES.type)}}
function adaptRecord(r){return{...r,ID:idOf(r)}}
function withApp(c){return{app_name:S.app||CONFIG.APP_NAME,...c}}
function errorText(e){
  if(e==null)return "Unknown Creator error";
  if(typeof e==="string")return e;
  if(e instanceof Error)return e.message||String(e);
  try{return JSON.stringify(e)}catch(_){return String(e)}
}
function assertResp(r,label){if(!r)throw new Error(`${label}: empty response.`);if(r.code!=null&&Number(r.code)!==3000)throw new Error(`${label}: ${r.message||r.description||JSON.stringify(r)}`);return r}
function prepareCreatorPayload(data){const out={...data};delete out[AF.furtherAssigned];delete out[AF.active];return out}
async function fetchRecords(report,criteria="",max=20){if(S.demo)return demoFetch(report,criteria);const out=[];let cursor="";for(let i=0;i<max;i++){const c=withApp({report_name:report,field_config:"all",max_records:1000});if(criteria)c.criteria=criteria;if(cursor)c.record_cursor=cursor;let r;try{r=assertResp(await ZOHO.CREATOR.DATA.getRecords(c),`Read ${report}`)}catch(e){const msg=errorText(e);/* Creator returns code 9220 when a valid, accessible report simply has no rows. Treat that as a successful empty result, not an access error. 9280 is also used by some Creator responses for no-data conditions. */if(/(?:^|\D)(?:9220|9280)(?:\D|$)|No records (?:exist|found)/i.test(msg))return out;throw e}const rows=Array.isArray(r.data)?r.data:[];out.push(...rows);cursor=r.record_cursor||r.cursor||"";if(!cursor||!rows.length)break}return out}
async function addRecord(data){if(S.demo)return demoAdd(data);if(!CONFIG.LIVE_WRITES)throw new Error("Live writes are disabled in CONFIG.");const r=assertResp(await ZOHO.CREATOR.DATA.addRecords(withApp({form_name:CONFIG.FORMS.tracking,payload:{data:prepareCreatorPayload(data)}})),"Create Design_Tracking");return String(r?.data?.ID||r?.data?.id||"")}
async function updateRecord(id,data){if(S.demo)return demoUpdate(id,data);if(!CONFIG.LIVE_WRITES)throw new Error("Live writes are disabled in CONFIG.");assertResp(await ZOHO.CREATOR.DATA.updateRecordById(withApp({report_name:CONFIG.REPORTS.tracking,id:String(id),payload:{data:prepareCreatorPayload(data)}})),"Update Design_Tracking");return id}
async function uploadFile(id,field,file){if(!file)return;if(file.size>CONFIG.MAX_FILE_BYTES)throw new Error(`${file.name} is larger than 50 MB.`);if(S.demo){const r=S.records.find(x=>idOf(x)===String(id));if(r)r[field]=file.name;return}assertResp(await ZOHO.CREATOR.FILE.uploadFile(withApp({report_name:CONFIG.REPORTS.tracking,id:String(id),field_name:field,file})),`Upload ${field}`)}
async function readFile(id,field){if(S.demo)throw new Error("File download is unavailable in demo mode.");return await ZOHO.CREATOR.FILE.readFile(withApp({report_name:CONFIG.REPORTS.tracking,id:String(id),field_name:field}))}
async function safeSource(report,label,{required=false}={}){
  try{return await fetchRecords(report)}
  catch(e){
    const detail=errorText(e);
    const msg=`${label} access failed (${report}).`;
    console.error(msg,e);
    if(required)throw new Error(`${msg} ${detail}`);
    toast(`${msg} ${detail}`,"error");
    return[];
  }
}

/*
  V17.1 FIX:
  Do not hard-code Design_Tracking_Report. Different Creator apps commonly have
  a generated report link such as All_Design_Tracking or Design_Tracking.
  Normal users may also lack META API permission, so we resolve the report only
  by trying DATA.getRecords against known candidates. No META call is required.
*/
async function resolveTrackingSource(){
  if(S.demo)return {report:CONFIG.REPORTS.tracking,rows:await fetchRecords(CONFIG.REPORTS.tracking)};

  const candidates=[...new Set([
    CONFIG.REPORTS.tracking,
    ...(CONFIG.TRACKING_REPORT_CANDIDATES||[])
  ].filter(Boolean))];

  let emptySuccess=null;
  const failures=[];

  for(const report of candidates){
    try{
      const rows=await fetchRecords(report,"",20);
      if(rows.length){
        CONFIG.REPORTS.tracking=report;
        log("tracking-report-resolved",{report,records:rows.length});
        return {report,rows};
      }
      if(!emptySuccess)emptySuccess={report,rows};
    }catch(e){
      failures.push(`${report}: ${errorText(e)}`);
      console.warn(`Tracking report candidate failed: ${report}`,e);
    }
  }

  if(emptySuccess){
    CONFIG.REPORTS.tracking=emptySuccess.report;
    log("tracking-report-resolved-empty",{report:emptySuccess.report});
    return emptySuccess;
  }

  throw new Error(
    `Design Tracking data is not accessible. Tried report links: ${candidates.join(", ")}. `+
    `Open the Design Tracking report in Creator, copy its exact link name, or grant this user View permission. `+
    (failures.length?`Details: ${failures.join(" | ")}`:"")
  );
}

function isAssignmentRecord(r){return scalar(r?.[AF.assignmentLevel])!==""||Boolean(scalar(r?.[AF.primaryAssignment]))||Boolean(scalar(r?.[AF.assignedFrom]))}
function isRevisionRecord(r){if(isAssignmentRecord(r))return false;const key=scalar(r?.[AF.logicalTaskKey]);return Boolean(scalar(r?.[AF.revision])||scalar(r?.[AF.parentDesignId])||key.startsWith("EXEC::"))}
function executionPrefix(assignmentId){return `EXEC::${assignmentId}::`}
function revisionNumber(v){const m=String(v||"").match(/(\d+)/);return m?Number(m[1]):0}
function revisionsForAssignment(a){if(!a)return[];const prefix=executionPrefix(idOf(a));return S.revisions.filter(r=>scalar(r[AF.logicalTaskKey]).startsWith(prefix)).sort((x,y)=>revisionNumber(x[AF.revision])-revisionNumber(y[AF.revision]))}
function currentRevision(a){const rows=revisionsForAssignment(a);return rows.length?rows[rows.length-1]:null}
function isHistoricalRevision(r,a){const cur=currentRevision(a);return r&&cur&&idOf(r)!==idOf(cur)}
function employeeNameFor(value){const v=String(value||"");const e=S.employees.find(x=>String(x.email||"").toLowerCase()===v.toLowerCase()||String(x.id||"")===v);return e?.name||v}
function personDisplay(value){const raw=scalar(value).trim();if(!raw)return"";const e=S.employees.find(x=>String(x.email||"").toLowerCase()===raw.toLowerCase()||String(x.id||"")===raw);return e?.name||raw}
function currentUserMatches(value){const raw=scalar(value).trim().toLowerCase(),me=String(S.user||"").trim().toLowerCase();if(!raw||!me)return false;if(raw===me||raw.includes(me))return true;const emp=S.employees.find(e=>String(e.email||"").toLowerCase()===me);return emp?raw===String(emp.id||"").toLowerCase()||raw===String(emp.name||"").toLowerCase():false}
function assignmentUser(a){return scalar(a?.[AF.assignedTo])||"Unassigned"}
function assignmentDisplayUser(a){return scalar(a?.[AF.assignedEmployeeName])||personDisplay(a?.[AF.assignedTo])||"Unassigned"}
function assignmentByDisplay(a){return personDisplay(a?.[AF.assignedBy])||scalar(a?.[AF.assignedBy])||"—"}
function scopeSummary(a){if(!a)return"Entire Project";const stored=scalar(a[AF.responsibility]);if(stored)return stored;const bits=[];for(const c of CRITERIA){if(c.key==="tag"){const t=scalar(a[AF.tagNo]),n=scalar(a[AF.equipmentName]);if(t||n)bits.push(`Tag: ${[t,n].filter(Boolean).join(" — ")}`)}else{const v=scalar(a[c.field]);if(v)bits.push(`${c.label}: ${v}`)}}return bits.length?bits.join(" • "):"Entire Project"}
function assignmentCriteria(a){return scalar(a?.[AF.criteria])||"Project"}
function assignmentChildren(id,rows=S.assignments){return rows.filter(a=>scalar(a[AF.assignedFrom])===String(id))}
function assignmentById(id){return S.assignments.find(a=>idOf(a)===String(id))||null}
function primaryForRows(rows){return rows.find(a=>num(a[AF.assignmentLevel],-1)===0&&!scalar(a[AF.assignedFrom]))||null}
function groupKey(a){return `${scalar(a[AF.projectCode])}||${scalar(a[AF.drawingMasterId])||scalar(a[AF.drawingDocument])}`}
function groupAssignments(){const map=new Map();for(const a of S.assignments){const k=groupKey(a);if(!map.has(k))map.set(k,{key:k,projectCode:scalar(a[AF.projectCode]),drawingId:scalar(a[AF.drawingMasterId]),drawingName:scalar(a[AF.drawingDocument]),short:scalar(a[AF.shortName]),rows:[]});map.get(k).rows.push(a)}return [...map.values()].map(g=>({...g,root:primaryForRows(g.rows)}))}
function groupForAssignment(a){return groupAssignments().find(g=>g.key===groupKey(a))||null}
function projectForCode(code){return S.projects.find(p=>p.code===String(code))||{id:"",code:String(code),name:""}}
function drawingForAssignment(a){return S.drawings.find(d=>d.id===scalar(a?.[AF.drawingMasterId])||d.name===scalar(a?.[AF.drawingDocument]))||{id:scalar(a?.[AF.drawingMasterId]),name:scalar(a?.[AF.drawingDocument])||"Drawing / Document",short:scalar(a?.[AF.shortName]),type:""}}
function groupAverageProgress(rows){if(!rows.length)return 0;return Math.round(rows.reduce((s,a)=>s+num(a[AF.progress]),0)/rows.length)}
function childStats(a){const kids=assignmentChildren(idOf(a));return{total:kids.length,completed:kids.filter(x=>scalar(x[AF.status])==="Completed").length,inProgress:kids.filter(x=>scalar(x[AF.status])==="In Progress").length}}
function currentExecutionLabel(a){const r=currentRevision(a);return r?`${scalar(r[AF.revision])||"R0"} • ${scalar(r[AF.status])||"Not Started"}`:"No revision"}
function searchMatchAssignment(a,q){if(!q)return true;const d=drawingForAssignment(a);const hay=[scalar(a[AF.projectCode]),d.name,d.short,assignmentDisplayUser(a),assignmentByDisplay(a),scopeSummary(a),assignmentCriteria(a),scalar(a[AF.tagNo]),scalar(a[AF.equipmentName])].join(" ").toLowerCase();return hay.includes(q.toLowerCase())}
function assignmentDueClass(a){if(isClosedAssignment(a))return"completed";const diff=dateDiffDays(toInputDate(a[AF.targetDate]));if(diff!=null&&diff<0)return"overdue";if(scalar(a[AF.status])==="In Progress")return"inprogress";return""}
function assignmentDueText(a){const iso=toInputDate(a[AF.targetDate]);const diff=dateDiffDays(iso);if(!iso)return"No target";if(isClosedAssignment(a))return displayDate(iso);if(diff<0)return `${Math.abs(diff)} day${Math.abs(diff)===1?"":"s"} overdue`;if(diff===0)return"Due today";if(diff<=7)return`Due in ${diff} day${diff===1?"":"s"}`;return displayDate(iso)}
function primaryAssignmentFor(project,drawing){return S.assignments.find(a=>scalar(a[AF.projectCode])===project.code&&(scalar(a[AF.drawingMasterId])===drawing.id||scalar(a[AF.drawingDocument])===drawing.name)&&num(a[AF.assignmentLevel],-1)===0&&!scalar(a[AF.assignedFrom]))||null}

async function bootstrap(){busy("Loading your drawing workspace…");try{
  if(S.demo){S.user="rohan@mega.tc";$("demoBanner").classList.remove("hidden")}else{
    if(!window.ZOHO||!ZOHO.CREATOR)throw new Error("Zoho Creator Widget SDK is not available in this page.");
    const init=await Promise.race([ZOHO.CREATOR.UTIL.getInitParams(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("Creator session timed out.")),9000))]);
    S.user=init?.loginUser||"";S.app=init?.appLinkName||CONFIG.APP_NAME;
  }
  const trackingSource=await resolveTrackingSource();
  const tr=trackingSource.rows;
  const [pr,dr,er,eq]=await Promise.all([
    safeSource(CONFIG.REPORTS.projects,"Project master"),safeSource(CONFIG.REPORTS.drawings,"Drawing master"),safeSource(CONFIG.REPORTS.employees,"Employee master"),safeSource(CONFIG.REPORTS.equipment,"Equipment master")
  ]);
  S.projects=pr.map(adaptProject).filter(x=>x.code).sort((a,b)=>String(b.code).localeCompare(String(a.code),undefined,{numeric:true}));
  S.drawings=dr.map(adaptDrawing).filter(x=>x.name).sort((a,b)=>a.name.localeCompare(b.name));
  S.employees=er.map(adaptEmployee).filter(x=>x.email||x.name).sort((a,b)=>a.name.localeCompare(b.name));
  S.equipment=eq.map(adaptEquipment);
  S.records=tr.map(adaptRecord);S.assignments=S.records.filter(isAssignmentRecord);S.revisions=S.records.filter(isRevisionRecord);
  $("sessionPill").textContent=S.user?`Signed in: ${personDisplay(S.user)||S.user}`:"Creator session connected";
  log("tracking-report-in-use",{report:CONFIG.REPORTS.tracking});
  renderView();
  if(!S.projects.length||!S.drawings.length||!S.employees.length||!S.equipment.length)toast("Some master reports are not accessible. Existing assignments still work, but new assignment/delegation options may be limited.","warn");
}catch(e){console.error(e);const detail=errorText(e);$("sessionPill").textContent="Creator data access error";$("page").innerHTML=`<div class="panel"><div class="panel-body"><div class="empty"><div class="ico">⚠</div><strong>Creator data could not be loaded</strong><div>${h(detail)}</div><div class="small" style="margin-top:8px">The widget accepts an empty Design_Tracking report as valid. If loading still fails, verify the exact report link name and this user's View permission.</div></div></div></div>`;toast(detail,"error")}finally{idle()}}
async function refreshData(){busy("Refreshing assignments and design revisions…");try{const source=await resolveTrackingSource();const tr=source.rows;S.records=tr.map(adaptRecord);S.assignments=S.records.filter(isAssignmentRecord);S.revisions=S.records.filter(isRevisionRecord);renderView();toast("Workspace refreshed.","good")}finally{idle()}}

function employeeOptions(value="",blank="Select team member…"){const v=String(value||"");return `<option value="">${h(blank)}</option>`+S.employees.map(e=>{const val=e.email||e.id;return `<option value="${h(val)}" ${String(val)===v?"selected":""}>${h(e.name||e.email)}${e.department?` — ${h(e.department)}`:""}</option>`}).join("")}
function projectOptions(value=""){return `<option value="">Select project…</option>`+S.projects.map(p=>`<option value="${h(p.id)}" ${p.id===value?"selected":""}>${h(p.code)}${p.name?` — ${h(p.name)}`:""}</option>`).join("")}
function drawingOptions(value=""){return `<option value="">Select drawing / document…</option>`+S.drawings.map(d=>`<option value="${h(d.id)}" ${d.id===value?"selected":""}>${h(d.name)}${d.short?` (${h(d.short)})`:""}</option>`).join("")}
function setView(v){if(S.view!=="detail")S.previousView=S.view;S.view=v;document.querySelectorAll(".navtab").forEach(b=>b.classList.toggle("active",b.dataset.view===v));renderView()}
function renderView(){document.querySelectorAll(".navtab").forEach(b=>b.classList.toggle("active",b.dataset.view===S.view));if(S.view==="home")return renderHome();if(S.view==="mine")return renderMyWork();if(S.view==="team")return renderMyTeam();if(S.view==="projects")return renderProjects();if(S.view==="new")return renderNewAssignment();if(S.view==="detail")return renderDetailPage();}

function myAssignments(){return S.assignments.filter(a=>currentUserMatches(a[AF.assignedTo]))}
function myDirectDelegations(){return S.assignments.filter(a=>{const parent=assignmentById(scalar(a[AF.assignedFrom]));return currentUserMatches(a[AF.assignedBy])||(parent&&currentUserMatches(parent[AF.assignedTo]))})}
function renderWorkCard(a){const d=drawingForAssignment(a),r=currentRevision(a),cls=assignmentDueClass(a);return `<div class="work-card ${cls}"><div class="work-top"><div class="doc-badge">${h(d.short||"DOC")}</div><div class="work-main"><div class="work-title">${h(d.name)}</div><div class="work-project">Project ${h(scalar(a[AF.projectCode]))} • ${h(assignmentCriteria(a))}</div></div>${statusPill(scalar(a[AF.status]))}</div><div class="scope">${h(scopeSummary(a))}</div><div class="work-meta"><div><span>Assigned by</span><strong>${h(assignmentByDisplay(a))}</strong></div><div><span>Target</span><strong>${h(assignmentDueText(a))}</strong></div></div><div class="work-foot">${r?`<span class="rev-chip">${h(scalar(r[AF.revision])||"R0")} · ${h(scalar(r[AF.status])||"Not Started")}</span>`:'<span class="rev-chip">No design started</span>'}<button class="btn sm primary" data-open-assignment="${h(idOf(a))}">Open</button></div></div>`}
function renderHome(){const mine=myAssignments(),active=mine.filter(a=>!isClosedAssignment(a)),inProg=mine.filter(a=>scalar(a[AF.status])==="In Progress"),overdue=mine.filter(a=>{const d=dateDiffDays(toInputDate(a[AF.targetDate]));return d!=null&&d<0&&!isClosedAssignment(a)}),completed=mine.filter(a=>scalar(a[AF.status])==="Completed"),q=S.globalSearch.trim().toLowerCase();const attention=mine.filter(a=>searchMatchAssignment(a,q)).sort((a,b)=>{const ad=dateDiffDays(toInputDate(a[AF.targetDate]));const bd=dateDiffDays(toInputDate(b[AF.targetDate]));return (ad??9999)-(bd??9999)}).slice(0,6);$("page").innerHTML=`<section class="hero"><div><h2>${h(greeting())}, ${h(personDisplay(S.user)||"Team Member")}</h2><p>See what needs your attention, continue design work, upload drawings, track revisions and delegate responsibility without opening the large Creator form.</p></div><div class="hero-badge"><div class="n">${active.length}</div><div class="l">ACTIVE RESPONSIBILITIES</div></div></section><section class="metrics"><div class="metric"><div class="metric-icon brand">✓</div><div><div class="num">${mine.length}</div><div class="label">Assigned to me</div></div></div><div class="metric"><div class="metric-icon blue">↻</div><div><div class="num">${inProg.length}</div><div class="label">In progress</div></div></div><div class="metric"><div class="metric-icon amber">!</div><div><div class="num">${overdue.length}</div><div class="label">Overdue</div></div></div><div class="metric"><div class="metric-icon green">✓</div><div><div class="num">${completed.length}</div><div class="label">Completed</div></div></div></section><div class="section-row"><div><h2>My priority work</h2><p>Nearest target dates are shown first.</p></div><button class="btn sm" data-view-jump="mine">View all my work</button></div>${attention.length?`<div class="cards">${attention.map(renderWorkCard).join("")}</div>`:`<div class="empty"><div class="ico">✓</div><strong>No work needs attention</strong>Your assigned drawing responsibilities will appear here.</div>`}<div class="section-row"><div><h2>My team activity</h2><p>Responsibilities you assigned further.</p></div><button class="btn sm" data-view-jump="team">View my team</button></div>${renderTeamPreview()}`}
function greeting(){const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"}
function renderTeamPreview(){const rows=myDirectDelegations().slice(0,5);if(!rows.length)return`<div class="empty compact"><strong>No delegated work yet</strong>Open one of your assignments and use <b>Assign Further</b>.</div>`;return `<div class="panel"><div class="panel-body"><div class="child-list">${rows.map(a=>`<div class="child-row"><div class="avatar">${h(initials(assignmentDisplayUser(a)))}</div><div class="main"><div class="name">${h(assignmentDisplayUser(a))}</div><div class="sc">${h(scalar(a[AF.projectCode]))} • ${h(drawingForAssignment(a).short||drawingForAssignment(a).name)} • ${h(scopeSummary(a))}</div></div>${statusPill(scalar(a[AF.status]))}<button class="btn sm" data-open-assignment="${h(idOf(a))}">Open</button></div>`).join("")}</div></div></div>`}

function renderMyWork(){const q=S.globalSearch.trim().toLowerCase(),rows=myAssignments().filter(a=>searchMatchAssignment(a,q)).sort((a,b)=>{const ad=dateDiffDays(toInputDate(a[AF.targetDate]));const bd=dateDiffDays(toInputDate(b[AF.targetDate]));return (ad??9999)-(bd??9999)});$("page").innerHTML=`<div class="section-row"><div><h2>My Work</h2><p>Every responsibility assigned directly to you. Open a card to update status, work on files, revisions or assign further.</p></div><span class="pill brand">${rows.length} assignments</span></div>${rows.length?`<div class="cards">${rows.map(renderWorkCard).join("")}</div>`:`<div class="empty"><div class="ico">⌁</div><strong>No assignments found</strong>${S.globalSearch?"Try another search.":"Work assigned to you will appear here."}</div>`}`}

function renderMyTeam(){const q=S.globalSearch.trim().toLowerCase(),rows=myDirectDelegations().filter(a=>searchMatchAssignment(a,q));const grouped=new Map();for(const a of rows){const g=groupKey(a);if(!grouped.has(g))grouped.set(g,[]);grouped.get(g).push(a)}$("page").innerHTML=`<div class="section-row"><div><h2>My Team</h2><p>Work you delegated from your own responsibilities. Each person can assign further again.</p></div><span class="pill brand">${rows.length} delegated</span></div>${rows.length?`<div class="group-grid">${[...grouped.values()].map(list=>{const a=list[0],d=drawingForAssignment(a),done=list.filter(x=>scalar(x[AF.status])==="Completed").length;return `<div class="group-card"><div class="group-head"><div class="doc-badge">${h(d.short||"DOC")}</div><div class="group-main"><div class="group-title">${h(d.name)}</div><div class="group-sub">Project ${h(scalar(a[AF.projectCode]))}</div></div><span class="pill">${list.length} people</span></div><div class="group-stats"><div class="mini-stat"><div class="n">${list.length}</div><div class="l">DELEGATED</div></div><div class="mini-stat"><div class="n">${done}</div><div class="l">COMPLETED</div></div><div class="mini-stat"><div class="n">${Math.round(list.reduce((s,x)=>s+num(x[AF.progress]),0)/list.length)}%</div><div class="l">AVG PROGRESS</div></div></div><div class="child-list">${list.slice(0,4).map(x=>`<div class="child-row"><div class="avatar">${h(initials(assignmentDisplayUser(x)))}</div><div class="main"><div class="name">${h(assignmentDisplayUser(x))}</div><div class="sc">${h(scopeSummary(x))}</div></div>${statusPill(scalar(x[AF.status]))}</div>`).join("")}</div><div style="margin-top:11px"><button class="btn sm primary" data-open-assignment="${h(idOf(a))}">Open structure</button></div></div>`}).join("")}</div>`:`<div class="empty"><div class="ico">♧</div><strong>No delegated responsibilities found</strong>Use <b>Assign Further</b> from one of your assignments to build your team structure.</div>`}`}

function renderProjects(){const q=S.globalSearch.trim().toLowerCase();const groups=groupAssignments().filter(g=>{const hay=[g.projectCode,g.drawingName,g.short,g.root?assignmentDisplayUser(g.root):"",...g.rows.map(scopeSummary)].join(" ").toLowerCase();return !q||hay.includes(q)}).sort((a,b)=>String(b.projectCode).localeCompare(String(a.projectCode),undefined,{numeric:true}));$("page").innerHTML=`<div class="section-row"><div><h2>Projects & Drawings</h2><p>Each Project + Drawing appears only once. Open it to see the complete family tree and design activity.</p></div><span class="pill brand">${groups.length} drawings</span></div>${groups.length?`<div class="group-grid">${groups.map(renderGroupCard).join("")}</div>`:`<div class="empty"><div class="ico">▦</div><strong>No project drawings found</strong>${S.globalSearch?"Try another search.":"Create a primary assignment to start a project drawing structure."}</div>`}`}
function renderGroupCard(g){const p=projectForCode(g.projectCode),d=g.root?drawingForAssignment(g.root):{name:g.drawingName,short:g.short},avg=groupAverageProgress(g.rows),done=g.rows.filter(x=>scalar(x[AF.status])==="Completed").length,revCount=g.rows.reduce((s,a)=>s+revisionsForAssignment(a).length,0);return `<div class="group-card"><div class="group-head"><div class="doc-badge">${h(d.short||"DOC")}</div><div class="group-main"><div class="group-title">${h(d.name||g.drawingName)}</div><div class="group-sub">Project ${h(g.projectCode)}${p.name?` • ${h(p.name)}`:""}</div></div>${g.root?statusPill(scalar(g.root[AF.status])):'<span class="pill amber">No primary</span>'}</div><div class="scope" style="margin-bottom:9px">Primary owner: <strong>${h(g.root?assignmentDisplayUser(g.root):"Not assigned")}</strong></div><div class="group-stats"><div class="mini-stat"><div class="n">${g.rows.length}</div><div class="l">ASSIGNMENTS</div></div><div class="mini-stat"><div class="n">${revCount}</div><div class="l">REVISIONS</div></div><div class="mini-stat"><div class="n">${done}</div><div class="l">COMPLETED</div></div></div><div class="small strong" style="margin-bottom:5px">Overall assignment progress ${avg}%</div>${progressBar(avg)}<div style="margin-top:12px"><button class="btn primary sm" data-open-group="${h(g.key)}">View structure</button></div></div>`}

function renderNewAssignment(){const p=S.projects.find(x=>x.id===S.newProjectId)||null,d=S.drawings.find(x=>x.id===S.newDrawingId)||null,existing=p&&d?primaryAssignmentFor(p,d):null;$("page").innerHTML=`<div class="new-wrap"><div class="stepper"><div class="step active"><span class="n">1</span>Project & Drawing</div><div class="step ${p&&d?"active":""}"><span class="n">2</span>Primary Owner</div><div class="step"><span class="n">3</span>Further delegation later</div></div><div class="new-card"><div class="new-head"><h2>Create Primary Drawing Assignment</h2><p>Create this once for the entire Project + Drawing. The assigned user can then divide the work to any number of levels.</p></div><div class="new-body"><div class="grid2"><div class="field"><label>Project Code *</label><select id="newProject">${projectOptions(S.newProjectId)}</select></div><div class="field"><label>Drawing / Document *</label><select id="newDrawing">${drawingOptions(S.newDrawingId)}</select></div></div>${p&&d?renderPrimaryForm(p,d,existing):'<div class="notice" style="margin-top:14px">Select a Project and Drawing / Document to continue.</div>'}</div></div></div>`}
function renderPrimaryForm(p,d,existing){if(existing)return `<div class="notice good" style="margin-top:14px"><strong>Primary assignment already exists.</strong><br>${h(d.name)} for Project ${h(p.code)} is assigned to ${h(assignmentDisplayUser(existing))}. No duplicate primary record will be created.<div style="margin-top:10px"><button class="btn primary" data-open-assignment="${h(idOf(existing))}">Open existing structure</button></div></div>`;return `<div class="notice good" style="margin-top:14px"><strong>Primary responsibility = Entire Project ${h(p.code)}</strong>. Further division is optional and starts from the user who receives it.</div><div class="grid3" style="margin-top:14px"><div class="field"><label>Assigned To *</label><select id="primaryUser">${employeeOptions()}</select></div><div class="field"><label>Priority</label><select id="primaryPriority">${PRIORITIES.map(p=>`<option ${p==="Medium"?"selected":""}>${h(p)}</option>`).join("")}</select></div><div class="field"><label>Status</label><select id="primaryStatus">${ASSIGNMENT_STATUSES.map(s=>`<option>${h(s)}</option>`).join("")}</select></div></div><div class="grid3" style="margin-top:12px"><div class="field"><label>Start Date *</label><input id="primaryStart" type="date" value="${todayIso()}"></div><div class="field"><label>Target Date *</label><input id="primaryTarget" type="date"></div><div class="field"><label>End Date</label><input id="primaryEnd" type="date"></div></div><div class="field" style="margin-top:12px"><label>Remark</label><textarea id="primaryRemark" placeholder="Optional assignment instruction"></textarea></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary lg" data-act="create-primary">Create Primary Assignment</button></div>`}

function openGroup(key){const g=groupAssignments().find(x=>x.key===key);if(!g||!g.root){toast("Primary assignment is not available for this drawing.","error");return}openAssignment(idOf(g.root))}
function openAssignment(id){const a=assignmentById(id);if(!a)return;S.previousView=S.view==="detail"?S.previousView:S.view;S.current=a;S.project=projectForCode(scalar(a[AF.projectCode]));S.drawing=drawingForAssignment(a);S.detailTab="overview";S.expanded.add(idOf(primaryForRows(groupForAssignment(a)?.rows||[])));S.selectedCriteria.clear();S.selectedTargets.clear();S.targetRows=[];S.targetSearch="";S.bulk={};S.view="detail";renderView()}
function currentGroupRows(){return S.current?(groupForAssignment(S.current)?.rows||[]):[]}
function familyPath(a){const rows=currentGroupRows(),map=new Map(rows.map(x=>[idOf(x),x])),path=[];let cur=a;while(cur){path.unshift(cur);const pid=scalar(cur[AF.assignedFrom]);cur=pid?map.get(pid):null}return path}
function renderTree(){const rows=currentGroupRows(),root=primaryForRows(rows);if(!root)return`<div class="tree-empty">No primary assignment.</div>`;const q=(S.treeSearch||"").toLowerCase();const allowed=new Set();if(q){for(const r of rows){const hay=[assignmentDisplayUser(r),scopeSummary(r),assignmentCriteria(r)].join(" ").toLowerCase();if(hay.includes(q)){let cur=r;while(cur){allowed.add(idOf(cur));cur=assignmentById(scalar(cur[AF.assignedFrom]))}}}}else rows.forEach(r=>allowed.add(idOf(r)));const renderNode=r=>{const id=idOf(r),kids=assignmentChildren(id,rows).filter(k=>allowed.has(idOf(k))),open=S.expanded.has(id),active=idOf(S.current)===id,rev=currentRevision(r);return `<div class="tree-node"><div class="node-row ${active?"active":""}" data-node="${h(id)}"><button class="expander ${kids.length?"":"blank"}" data-expand="${h(id)}">${open?"−":"+"}</button><div class="avatar">${h(initials(assignmentDisplayUser(r)))}</div><div class="node-main"><div class="node-user">${h(assignmentDisplayUser(r))}</div><div class="node-scope">${h(scopeSummary(r))}</div></div><div class="node-side">${rev?`<span class="pill purple">${h(scalar(rev[AF.revision])||"R0")}</span>`:statusPill(scalar(r[AF.status]))}<div class="node-level">Level ${num(r[AF.assignmentLevel])}</div></div></div>${open&&kids.length?`<div class="tree-children">${kids.map(renderNode).join("")}</div>`:""}</div>`};return renderNode(root)}
function renderDetailPage(){if(!S.current){S.view="home";return renderHome()}const a=S.current,d=S.drawing||drawingForAssignment(a),path=familyPath(a);$("page").innerHTML=`<div class="detail-shell"><aside class="panel tree-panel"><div class="tree-head"><div class="strong">Assignment Structure</div><div class="tiny muted" style="margin:2px 0 9px">Expand people and responsibilities.</div><div class="tree-search"><input id="treeSearch" class="input" placeholder="Search person / scope…" value="${h(S.treeSearch||"")}"></div></div><div id="treeArea" class="tree-scroll">${renderTree()}</div></aside><section class="detail-main"><div class="detail-hero"><div class="crumbs"><button data-back>← Back</button><span>›</span><span>Project ${h(scalar(a[AF.projectCode]))}</span><span>›</span><span>${h(d.short||d.name)}</span>${path.length>1?`<span>›</span><span>${h(assignmentDisplayUser(a))}</span>`:""}</div><div class="detail-top"><div class="detail-title"><div class="doc-badge">${h(d.short||"DOC")}</div><div><h2>${h(d.name)}</h2><p>Project ${h(scalar(a[AF.projectCode]))} • ${h(assignmentDisplayUser(a))}'s responsibility</p></div></div><div class="detail-actions">${statusPill(scalar(a[AF.status]))}${currentRevision(a)?`<span class="pill purple">Current ${h(scalar(currentRevision(a)[AF.revision])||"R0")}</span>`:""}</div></div><div class="detail-meta"><span class="pill">Assigned by ${h(assignmentByDisplay(a))}</span><span class="pill">Level ${num(a[AF.assignmentLevel])}</span><span class="pill">Target ${h(displayDate(a[AF.targetDate]))}</span></div></div><div class="subtabs"><button class="subtab ${S.detailTab==="overview"?"active":""}" data-detail-tab="overview">Overview</button><button class="subtab ${S.detailTab==="files"?"active":""}" data-detail-tab="files">Design Files</button><button class="subtab ${S.detailTab==="revisions"?"active":""}" data-detail-tab="revisions">Revision History</button><button class="subtab ${S.detailTab==="delegate"?"active":""}" data-detail-tab="delegate">Assign Further</button></div><div id="detailTabBody">${renderDetailTab()}</div></section></div>`}
function renderDetailTab(){if(S.detailTab==="files")return renderFilesTab();if(S.detailTab==="revisions")return renderRevisionTab();if(S.detailTab==="delegate")return renderDelegateTab();return renderOverviewTab()}
function renderOverviewTab(){const a=S.current,k=childStats(a),r=currentRevision(a),canEdit=currentUserMatches(a[AF.assignedTo]);return `<div class="tab-card"><div class="scope-box"><div class="k">RESPONSIBILITY</div><div class="v">${h(scopeSummary(a))}</div></div><div class="summary"><div class="summary-item"><div class="k">ASSIGNED TO</div><div class="v">${h(assignmentDisplayUser(a))}</div></div><div class="summary-item"><div class="k">ASSIGNED BY</div><div class="v">${h(assignmentByDisplay(a))}</div></div><div class="summary-item"><div class="k">START DATE</div><div class="v">${h(displayDate(a[AF.startDate]))}</div></div><div class="summary-item"><div class="k">TARGET DATE</div><div class="v">${h(displayDate(a[AF.targetDate]))}</div></div><div class="summary-item"><div class="k">STATUS</div><div class="v">${statusPill(scalar(a[AF.status]))}</div></div><div class="summary-item"><div class="k">PROGRESS</div><div class="v">${num(a[AF.progress])}%</div></div><div class="summary-item"><div class="k">CRITERIA</div><div class="v">${h(assignmentCriteria(a))}</div></div><div class="summary-item"><div class="k">END DATE</div><div class="v">${h(displayDate(a[AF.endDate]))}</div></div></div><div class="two-col"><div><div class="section-row" style="margin-top:0"><div><h2>Design execution</h2><p>Files, workflow and current revision for this responsibility.</p></div></div>${r?`<div class="exec-hero"><div class="exec-rev"><div class="rev-circle">${h(scalar(r[AF.revision])||"R0")}</div><div><h3>${h(scalar(r[AF.status])||"Not Started")}</h3><p>${h(scalar(r[AF.revisionDescription])||"No revision description")}</p></div></div><button class="btn sm primary" data-detail-tab="files">Open design</button></div>`:`<div class="empty compact"><strong>No design revision started</strong>${canEdit?`<div style="margin-top:9px"><button class="btn sm primary" data-detail-tab="files">Start R0</button></div>`:"The assignee can start R0 from Design Files."}</div>`}</div><div><div class="section-row" style="margin-top:0"><div><h2>Further assignments</h2><p>${k.total} responsibility${k.total===1?"":"ies"} below this node.</p></div>${canEdit?'<button class="btn sm soft" data-detail-tab="delegate">Assign Further</button>':""}</div>${k.total?`<div class="child-list">${assignmentChildren(idOf(a)).slice(0,5).map(c=>`<div class="child-row"><div class="avatar">${h(initials(assignmentDisplayUser(c)))}</div><div class="main"><div class="name">${h(assignmentDisplayUser(c))}</div><div class="sc">${h(scopeSummary(c))}</div></div>${statusPill(scalar(c[AF.status]))}</div>`).join("")}</div>`:`<div class="empty compact"><strong>No further assignment</strong>This responsibility has not been divided further.</div>`}</div></div><div class="actions" style="margin-top:14px">${canEdit?'<button class="btn" data-act="edit-assignment">Update status / progress</button>':""}<button class="btn" data-detail-tab="revisions">Revision history (${revisionsForAssignment(a).length})</button></div></div>`}

function renderFilesTab(){const a=S.current,r=currentRevision(a);if(!r)return renderStartR0();const locked=revisionLocked(r,a),editable=canEditRevision(a,r),fileRows=[[AF.drawingFile,"Drawing File","PDF / controlled drawing"],[AF.nativeFile,"Native File","DWG / XLSX / source"],[AF.supportingFile,"Supporting File","Calculation / reference"]];return `<div class="tab-card"><div class="exec-hero"><div class="exec-rev"><div class="rev-circle">${h(scalar(r[AF.revision])||"R0")}</div><div><h3>${h(locked?"Controlled revision":"Current working revision")}</h3><p>${h(scalar(r[AF.revisionDescription])||"No revision description")}</p></div></div><div class="actions">${statusPill(scalar(r[AF.status]))}${isHistoricalRevision(r,a)?'<span class="pill amber">Read only</span>':""}</div></div><div class="grid2"><div class="field"><label>Drawing Number</label><input id="execDrawingNo" value="${h(scalar(r[AF.drawingNumber]))}" ${editable?"":"disabled"}></div><div class="field"><label>Revision Description</label><input id="execRevDesc" value="${h(scalar(r[AF.revisionDescription]))}" ${editable?"":"disabled"}></div></div><div class="role-grid" style="margin-top:11px"><div class="field"><label>Checker</label><select id="execChecker" ${editable?"":"disabled"}>${employeeOptions(scalar(r[AF.checker]),"Select checker…")}</select></div><div class="field"><label>Reviewer</label><select id="execReviewer" ${editable?"":"disabled"}>${employeeOptions(scalar(r[AF.reviewer]),"Select reviewer…")}</select></div><div class="field"><label>Approver</label><select id="execApprover" ${editable?"":"disabled"}>${employeeOptions(scalar(r[AF.approver]),"Select approver…")}</select></div></div><div class="field" style="margin-top:11px"><label>Design Remark</label><textarea id="execRemark" ${editable?"":"disabled"}>${h(scalar(r[AF.remark]))}</textarea></div><div class="file-grid">${fileRows.map(([field,label,hint])=>renderFileBox(r,field,label,hint,editable)).join("")}</div>${editable?'<div class="actions"><button function renderStartR0(){const a=S.current;if(!currentUserMatches(a[AF.assignedTo]))return `<div class="tab-card"><div class="empty"><div class="ico">🔒</div><strong>No design revision yet</strong>Only ${h(assignmentDisplayUser(a))}, the user responsible for this assignment, can start R0.</div></div>`;return `<div class="tab-card"><div class="empty compact" style="margin-bottom:13px"><strong>Start the first controlled design revision</strong>R0 will be linked to this exact assignment responsibility. All later revisions remain in history.</div><div class="grid2"><div class="field"><label>Drawing Number</label><input id="r0DrawingNo" placeholder="Example: 25005-SLP-001"></div><div class="field"><label>Revision</label><input value="R0" disabled></div></div><div class="field" style="margin-top:11px"><label>Revision Description *</label><input id="r0Desc" placeholder="Initial issue / first design"></div><div class="role-grid" style="margin-top:11px"><div class="field"><label>Checker</label><select id="r0Checker">${employeeOptions("","Select checker…")}</select></div><div class="field"><label>Reviewer</label><select id="r0Reviewer">${employeeOptions("","Select reviewer…")}</select></div><div class="field"><label>Approver</label><select id="r0Approver">${employeeOptions("","Select approver…")}</select></div></div><div class="field" style="margin-top:11px"><label>Design Remark</label><textarea id="r0Remark" placeholder="Optional design note"></textarea></div><div class="file-grid">${renderNewFileBox("r0DrawingFile","Drawing File","PDF / controlled drawing")}${renderNewFileBox("r0NativeFile","Native File","DWG / XLSX / source")}${renderNewFileBox("r0SupportingFile","Supporting File","Calculation / reference")}</div><div class="actions"><button class="btn primary lg" data-act="start-r0">Start R0</button></div></div>`}

function workflowRoleAllowed(role,a,r){if(role==="owner")return currentUserMatches(a[AF.assignedTo]);if(role==="checker")return currentUserMatches(r[AF.checker]);if(role==="reviewer")return currentUserMatches(r[AF.reviewer]);if(role==="approver")return currentUserMatches(r[AF.approver]);if(role==="ownerOrApprover")return currentUserMatches(a[AF.assignedTo])||currentUserMatches(r[AF.approver]);return false}

function canAssignFurther(a){return currentUserMatches(a?.[AF.assignedTo])}
function equipmentWithinAssignment(eq,a){if(String(eq.project||"")!==scalar(a[AF.projectCode]))return false;const checks=[[AF.plantSection,"plantSection"],[AF.plantSectionType,"plantSectionType"],[AF.groupCode,"groupCode"],[AF.department,"department"],[AF.equipmentCategory,"equipmentCategory"],[AF.equipmentType,"equipmentType"],[AF.tagNo,"tag"]];for(const [f,k] of checks){const v=scalar(a[f]);if(v&&String(eq[k]||"")!==v)return false}return true}
function targetKey(row){return [...S.selectedCriteria].map(k=>k==="tag"?`${row.tag}::${row.name}`:String(row[k]||"")).join("||")}
function targetLabel(row){return [...S.selectedCriteria].map(k=>{const c=CRITERIA.find(x=>x.key===k);return k==="tag"?`${row.tag||"—"} — ${row.name||"—"}`:`${c.label}: ${row[k]||"—"}`}).join(" • ")}
function makeTargetRows(a){if(!S.selectedCriteria.size)return[];const base=S.equipment.filter(eq=>equipmentWithinAssignment(eq,a)),map=new Map();for(const eq of base){const row={plantSection:eq.plantSection,plantSectionType:eq.plantSectionType,equipmentCategory:eq.equipmentCategory,tag:eq.tag,name:eq.name,equipmentRecordId:eq.id,groupCode:eq.groupCode,department:eq.department,equipmentType:eq.equipmentType};const k=targetKey(row);if(k&&!map.has(k))map.set(k,row)}return [...map.values()].sort((x,y)=>targetLabel(x).localeCompare(targetLabel(y),undefined,{numeric:true}))}
function existingChildForTarget(parent,row){return assignmentChildren(idOf(parent)).find(ch=>[...S.selectedCriteria].every(k=>{const c=CRITERIA.find(x=>x.key===k);if(k==="tag")return scalar(ch[AF.tagNo])===row.tag;return scalar(ch[c.field])===String(row[k]||"")}))}
function renderDelegateTab(){const a=S.current;if(!canAssignFurther(a))return `<div class="tab-card"><div class="empty"><div class="ico">🔒</div><strong>Only ${h(assignmentDisplayUser(a))} can assign this responsibility further</strong>You can still view the family tree and design history.</div></div>`;S.targetRows=makeTargetRows(a);return `<div class="tab-card"><div class="scope-box"><div class="k">CURRENT RESPONSIBILITY — LOCKED</div><div class="v">${h(scopeSummary(a))}</div></div><div class="section-row" style="margin-top:0"><div><h2>How do you want to divide this work?</h2><p>Select one or more criteria. The system only shows values inside your received responsibility.</p></div></div><div class="criteria-grid">${CRITERIA.map(c=>`<div class="criterion ${S.selectedCriteria.has(c.key)?"selected":""}" data-criterion="${h(c.key)}"><div class="t">${h(c.icon)} &nbsp;${h(c.label)}</div><div class="s">${c.key==="tag"?"Select individual equipment / tags":"Group work by this business value"}</div></div>`).join("")}</div><div id="targetArea">${renderTargetArea(a)}</div></div>`}
function renderTargetArea(a){S.targetRows=makeTargetRows(a);if(!S.selectedCriteria.size)return `<div class="notice">Choose at least one option above. Example: <b>Plant Section + Plant Section Type</b>, or <b>Tag / Equipment</b>.</div>`;const q=S.targetSearch||"",rows=S.targetRows.filter(r=>!q||targetLabel(r).toLowerCase().includes(q.toLowerCase())),selected=S.selectedTargets.size;return `<div class="target-toolbar"><input id="targetSearch" class="input search" placeholder="Search matching responsibility…" value="${h(q)}"><div class="actions"><button class="btn sm" data-act="select-next-10">Select next 10</button><button class="btn sm" data-act="select-all-targets">Select all</button><button class="btn link sm" data-act="clear-targets">Clear</button></div></div><div class="selection-note"><b>${selected}</b> selected of ${rows.length} matching responsibility values.</div><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th></th>${[...S.selectedCriteria].map(k=>{const c=CRITERIA.find(x=>x.key===k);return k==="tag"?'<th>Tag No</th><th>Equipment Name</th>':`<th>${h(c.label)}</th>`}).join("")}<th>Availability</th></tr></thead><tbody>${rows.length?rows.map(r=>{const key=targetKey(r),ex=existingChildForTarget(a,r),sel=S.selectedTargets.has(key);return `<tr class="${sel?"selected":""}"><td><input class="check target-check" type="checkbox" data-target="${h(key)}" ${sel?"checked":""} ${ex?"disabled":""}></td>${[...S.selectedCriteria].map(k=>{const c=CRITERIA.find(x=>x.key===k);return k==="tag"?`<td><b>${h(r.tag||"—")}</b></td><td>${h(r.name||"—")}</td>`:`<td>${h(r[k]||"—")}</td>`}).join("")}<td>${ex?'<span class="pill green">Already assigned</span>':'<span class="pill">New</span>'}</td></tr>`}).join(""):'<tr><td colspan="12" style="padding:20px;text-align:center;color:#667085">No matching values exist inside this responsibility.</td></tr>'}</tbody></table></div>${selected?renderBulkBar():""}`}
function renderBulkBar(){const d=S.bulk||{};return `<div class="bulk-bar"><div class="bulk-grid"><div class="field"><label>Assign selected to *</label><select id="bulkUser">${employeeOptions(d.user||"")}</select></div><div class="field"><label>Priority</label><select id="bulkPriority">${PRIORITIES.map(p=>`<option ${p===(d.priority||"Medium")?"selected":""}>${h(p)}</option>`).join("")}</select></div><div class="field"><label>Start Date *</label><input id="bulkStart" type="date" value="${h(d.start||todayIso())}"></div><div class="field"><label>Target Date *</label><input id="bulkTarget" type="date" value="${h(d.target||"")}"></div><div class="field"><label>End Date</label><input id="bulkEnd" type="date" value="${h(d.end||"")}"></div><div class="field"><label>Common Remark</label><input id="bulkRemark" value="${h(d.remark||"")}" placeholder="Optional instruction"></div><button class="btn primary" data-act="review-bulk">Review ${S.selectedTargets.size}</button></div><div class="bulk-summary">Each selected row becomes an independent Design_Tracking assignment record. The receiver can divide it again later.</div></div>`}
function collectBulk(){S.bulk={user:$("bulkUser")?.value||"",priority:$("bulkPriority")?.value||"Medium",start:$("bulkStart")?.value||"",target:$("bulkTarget")?.value||"",end:$("bulkEnd")?.value||"",remark:$("bulkRemark")?.value||""};return S.bulk}
function responsibilityFromData(data){const bits=[`Project ${scalar(data[AF.projectCode])||S.project?.code||""}`],s=scalar(data[AF.plantSection]),st=scalar(data[AF.plantSectionType]),g=scalar(data[AF.groupCode]),d=scalar(data[AF.department]),c=scalar(data[AF.equipmentCategory]),t=scalar(data[AF.equipmentType]),tag=scalar(data[AF.tagNo]),name=scalar(data[AF.equipmentName]);if(s)bits.push(s);if(st)bits.push(st);if(g)bits.push(`Group: ${g}`);if(d)bits.push(`Department: ${d}`);if(c)bits.push(`Category: ${c}`);if(t)bits.push(`Type: ${t}`);if(tag||name)bits.push(`Tag: ${[tag,name].filter(Boolean).join(" — ")}`);return bits.filter(Boolean).join(" › ")}

function buildChildPayload(parent,row,draft){const d=drawingForAssignment(parent),criteriaLabels=[...S.selectedCriteria].map(k=>CRITERIA.find(c=>c.key===k).label),data={
  [AF.projectCode]:scalar(parent[AF.projectCode]),[AF.projectRecordId]:scalar(parent[AF.projectRecordId]),[AF.drawingDocument]:d.name,[AF.drawingMasterId]:d.id,[AF.shortName]:d.short||"",
  [AF.primaryAssignment]:scalar(parent[AF.primaryAssignment])||idOf(primaryForRows(groupForAssignment(parent)?.rows||[])),[AF.assignedFrom]:idOf(parent),[AF.assignmentLevel]:num(parent[AF.assignmentLevel])+1,
  [AF.assignedBy]:S.user||assignmentUser(parent),[AF.assignedTo]:draft.user,[AF.assignedEmployeeName]:employeeNameFor(draft.user),[AF.criteria]:assignmentCriteriaPayload(criteriaLabels),
  [AF.startDate]:toCreatorDate(draft.start),[AF.targetDate]:toCreatorDate(draft.target),[AF.endDate]:toCreatorDate(draft.end),[AF.priority]:draft.priority||scalar(parent[AF.priority])||"Medium",[AF.status]:"Not Started",[AF.progress]:0,[AF.remark]:draft.remark||""
};for(const c of CRITERIA){if(c.key==="tag"){if(parent[AF.tagNo])data[AF.tagNo]=scalar(parent[AF.tagNo]);if(parent[AF.equipmentName])data[AF.equipmentName]=scalar(parent[AF.equipmentName]);if(parent[AF.equipmentRecordId])data[AF.equipmentRecordId]=scalar(parent[AF.equipmentRecordId])}else if(parent[c.field])data[c.field]=scalar(parent[c.field])}for(const k of S.selectedCriteria){const c=CRITERIA.find(x=>x.key===k);if(k==="tag"){data[AF.tagNo]=row.tag||"";data[AF.equipmentName]=row.name||"";if(row.equipmentRecordId)data[AF.equipmentRecordId]=row.equipmentRecordId}else data[c.field]=row[k]||""}data[AF.responsibility]=responsibilityFromData(data);return data}

async function createPrimary(){const p=S.projects.find(x=>x.id===S.newProjectId),d=S.drawings.find(x=>x.id===S.newDrawingId),user=$("primaryUser")?.value,priority=$("primaryPriority")?.value||"Medium",start=$("primaryStart")?.value,target=$("primaryTarget")?.value,end=$("primaryEnd")?.value,remark=$("primaryRemark")?.value.trim()||"",status=$("primaryStatus")?.value||"Not Started";if(!p||!d)throw new Error("Select Project and Drawing first.");if(!user||!start||!target)throw new Error("Assigned To, Start Date and Target Date are required.");if(end&&end<start)throw new Error("End Date cannot be before Start Date.");if(primaryAssignmentFor(p,d))throw new Error("Primary Assignment already exists for this Project + Drawing.");busy("Creating primary assignment…");try{const data={[AF.projectCode]:p.code,[AF.projectRecordId]:p.id||"",[AF.drawingDocument]:d.name,[AF.drawingMasterId]:d.id,[AF.shortName]:d.short||"",[AF.assignmentLevel]:0,[AF.assignedBy]:S.user||user,[AF.assignedTo]:user,[AF.assignedEmployeeName]:employeeNameFor(user),[AF.criteria]:"Project",[AF.responsibility]:`Entire Project ${p.code}`,[AF.startDate]:toCreatorDate(start),[AF.targetDate]:toCreatorDate(target),[AF.endDate]:toCreatorDate(end),[AF.priority]:priority,[AF.status]:status,[AF.progress]:status==="Completed"?100:0,[AF.remark]:remark};const id=await addRecord(data);if(!id)throw new Error("Creator did not return the new assignment ID.");await updateRecord(id,{[AF.primaryAssignment]:id});const record={ID:id,...data,[AF.primaryAssignment]:id};S.records.push(record);S.assignments.push(record);toast("Primary assignment created.","good");openAssignment(id)}finally{idle()}}
async function reviewBulk(){const d=collectBulk();if(!d.user)throw new Error("Select Assigned To.");if(!d.start||!d.target)throw new Error("Start Date and Target Date are required.");if(d.end&&d.end<d.start)throw new Error("End Date cannot be before Start Date.");const parentTarget=toInputDate(S.current[AF.targetDate]),late=parentTarget&&d.target>parentTarget;if(late&&!d.remark.trim())throw new Error("Target Date is later than the received responsibility. Add a Remark to continue.");const rows=S.targetRows.filter(r=>S.selectedTargets.has(targetKey(r))&&!existingChildForTarget(S.current,r));if(!rows.length)throw new Error("No new responsibilities are selected.");openModal("Review Further Assignment",`${rows.length} independent responsibilities will be created under ${assignmentDisplayUser(S.current)}.`,reviewBulkHtml(rows,d,late),`<button class="btn" data-modal="close">Back</button><button class="btn primary" data-modal="confirm-bulk">Create ${rows.length} Assignments</button>`)}

  $("globalSearch").addEventListener("input",e=>{S.globalSearch=e.target.value;renderView()});
  document.addEventListener("click",e=>{
    const v=e.target.closest("[data-view-jump]");if(v)return setView(v.dataset.viewJump);
    const oa=e.target.closest("[data-open-assignment]");if(oa)return openAssignment(oa.dataset.openAssignment);

    const dt=e.target.closest("[data-detail-tab]");if(dt){S.detailTab=dt.dataset.detailTab;S.selectedCriteria.clear();S.selectedTargets.clear();return renderView()}
    const cr=e.target.closest("[data-criterion]");if(cr){const k=cr.dataset.criterion;S.selectedCriteria.has(k)?S.selectedCriteria.delete(k):S.selectedCriteria.add(k);S.selectedTargets.clear();return renderView()}
    const ac=e.target.closest("[data-act]");if(ac)return guarded(()=>handleAction(ac.dataset.act));
    const wf=e.target.closest("[data-workflow-to]");if(wf)return guarded(()=>moveWorkflow(wf.dataset.workflowTo));
    const dl=e.target.closest("[data-download-file]");if(dl)return guarded(()=>downloadRevisionFile(dl.dataset.downloadFile,dl.dataset.fileField,dl.dataset.fileLabel));
    const vr=e.target.closest("[data-view-revision]");if(vr)return viewRevisionModal(vr.dataset.viewRevision);
    const md=e.target.closest("[data-modal]");if(md)return guarded(()=>handleModal(md.dataset.modal,md));
  });
  document.addEventListener("change",e=>{
    if(e.target.id==="newProject"){S.newProjectId=e.target.value;return renderView()}
    if(e.target.id==="newDrawing"){S.newDrawingId=e.target.value;return renderView()}
    if(e.target.classList.contains("target-check")){const k=e.target.dataset.target;e.target.checked?S.selectedTargets.add(k):S.selectedTargets.delete(k);return renderView()}
  });
  document.addEventListener("input",e=>{
    if(e.target.id==="treeSearch"){S.treeSearch=e.target.value;const area=$("treeArea");if(area)area.innerHTML=renderTree()}
    if(e.target.id==="targetSearch"){S.targetSearch=e.target.value;const area=$("targetArea");if(area)area.innerHTML=renderTargetArea(S.current)}
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("modalBackdrop").classList.contains("hidden"))closeModal()});
}
